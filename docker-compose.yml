version: '3.8'
services:
  chatbot-service-postgres:
    image: postgres:13-alpine
    container_name: chatbot-service-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ev_chatbot_db}
    ports:
      - "5436:5432"
    volumes:
      - chatbot-service-db:/var/lib/postgresql/data
    networks:
      - chatbot-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chatbot-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-service
    ports:
      - "8006:8006"
    environment:
      DB_HOST: chatbot-service-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ev_chatbot_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_SERVER: ${EUREKA_SERVER:-http://localhost:8761/eureka/}
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForJWTTokenGenerationAndValidationWithMinimum32Characters}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://evrechargeindia.com,https://www.evrechargeindia.com,http://localhost:4200,capacitor://localhost,https://localhost}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-2048}
      CHATBOT_MAX_HISTORY: ${CHATBOT_MAX_HISTORY:-20}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    networks:
      - chatbot-service-network
    depends_on:
      chatbot-service-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

volumes:
  chatbot-service-db:
    driver: local

networks:
  chatbot-service-network:
    driver: bridge
